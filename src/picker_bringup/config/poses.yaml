# 로봇 자세·박스 위치·모션 설정 (담당: 류창표)
# ⚠️ 아래 값은 전부 예시입니다. 티치펜던트로 실제 값을 측정해서 바꾸세요.
# 좌표 단위: mm / deg, 로봇 base 기준, 자세 = [x, y, z, rx, ry, rz]

# 카메라 촬영 자세 (관절값). 캘리브레이션도 반드시 이 자세에서 수행
scan_joint_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]
# 스캔 자세에서 그리퍼의 대략적인 x, y (planner의 거리 계산 기준점)
scan_xy_mm: [400.0, 0.0]

# 그리퍼가 바닥을 수직으로 내려다볼 때의 [rx, ry, rz] (티치펜던트에서 확인)
tool_down_orientation_deg: [0.0, 180.0, 0.0]

# 놓을 위치 (박스 위 — 그리퍼를 열 위치)
boxes:
  A:    [250.0,  350.0, 200.0, 0.0, 180.0, 0.0]   # 긴급 주문 박스
  B:    [250.0, -350.0, 200.0, 0.0, 180.0, 0.0]   # 일반 주문 박스
  HOLD: [100.0,  400.0, 200.0, 0.0, 180.0, 0.0]   # 보류함 (주문에 없는 물체)

# 이 범위 밖으로는 움직이지 않음 (파지 지점 기준, F3-7)
workspace_mm:
  x: [250.0, 700.0]
  y: [-300.0, 300.0]
  z: [5.0, 300.0]

motion:
  cube_size_mm: 50.0
  approach_height_mm: 100.0   # 큐브 윗면 위 접근 높이
  grasp_depth_mm: 25.0        # 윗면에서 얼마나 내려가서 잡을지 (큐브 절반 정도)
  grasp_fail_width_mm: 10.0   # 닫은 뒤 벌림 폭이 이 값 이하면 '놓침'
  joint_vel: 30.0             # deg/s
  joint_acc: 30.0
  line_vel: 150.0             # mm/s  (시연 시 안전을 위해 낮게 시작)
  line_acc: 150.0
  slow_vel: 50.0              # 하강·상승 시 속도
